    <script>
      // Runs before anything paints, so there's no flash of the wrong theme.
      // Defaults to dark (the site's primary theme) when nothing is saved yet.
      (function () {
        try {
          var saved = localStorage.getItem('mectec-theme');
          if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {
          // Storage unavailable — falls back to the default dark theme.
        }
      })();
    </script>
